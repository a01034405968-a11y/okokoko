function dbPut(get,coll,id,patch,okMsg){
  var ref=DB.doc(coll+'/'+id),cur=get(id),undo=null;
  if(cur){var old={};Object.keys(patch).forEach(function(k){old[k]=cur[k]});Object.assign(cur,patch);
    undo=function(){Object.keys(old).forEach(function(k){if(old[k]===undefined)delete cur[k];else cur[k]=old[k]})}}
  var ok=function(){if(okMsg)toast(okMsg)};
  var fail=function(e){if(undo)undo();dbFail(e);render()};
  ref.update(patch).then(ok,function(e){
    if(cur&&e&&e.code==='invalid_argument'){ref.set(Object.assign({},cur)).then(ok,fail)}else fail(e)});
}

  arr:null,

  get:function(id){return this.all().filter(function(x){return x.id===id})[0]},
  add:function(o){if(DB){DB.doc(name+'/'+o.id).set(Object.assign({},o,{t:Date.now()})).catch(dbFail)}else{o.t=Date.now();S[name].push(o)}},
  patch:function(id,p,okMsg){var me=this;if(DB){dbPut(function(i){return me.get(i)},name,id,p,okMsg)}else{var x=this.get(id);if(x)Object.assign(x,p);if(okMsg)toast(okMsg)}}

  BK().slice().forEach(function(b){

}

function slotRows(f){

    var dis=past||full;if(!dis)any=true;
    var cls='slot'+(full?' full':'')+(pend&&!full?' pend':'')+(mine?' mine':'')+(ui.sel===h?' sel':'');
    var label=past?'지남':full?'마감':mine?'내 예약':pend?'승인 대기 포함':'예약 가능';
    out+='<button class="'+cls+'" data-act="slot" data-v="'+h+'" '+(dis?'disabled':'')+' aria-pressed="'+(ui.sel===h)+'"><span class="mono"><b>'+pad(h)+':00</b></span><span class="bar" aria-hidden="true"><i style="width:'+Math.min(100,u/f.cap*100)+'%"></i></span><span class="cnt"><span class="mono">'+u+'/'+f.cap+'명</span><br><span class="muted" style="font-size:12px">'+label+'</span></span></button>';

/* ---------- color analysis ---------- */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s,l]}
function cname(r,g,b){var x=rgb2hsl(r,g,b),h=x[0],s=x[1],l=x[2];
  if(l<.16)return '검정색';if(l>.88)return '흰색';if(s<.14)return l<.5?'진회색':'회색';
  if(h>=15&&h<45&&l<.4)return '갈색';
  if(h<15||h>=345)return '빨간색';if(h<42)return '주황색';if(h<68)return '노란색';if(h<170)return '초록색';if(h<195)return '청록색';if(h<255)return '파란색';if(h<290)return '보라색';return '분홍색'}
function analyze(img){
  var c=document.createElement('canvas');c.width=c.height=48;var x=c.getContext('2d');x.drawImage(img,0,0,48,48);
  var d=x.getImageData(0,0,48,48).data,b={};
  for(var yy=6;yy<42;yy++)for(var xx=6;xx<42;xx++){var i=(yy*48+xx)*4,r=d[i],g=d[i+1],bl=d[i+2];
    var hsl=rgb2hsl(r,g,bl);if(hsl[2]>.93)continue;var n=cname(r,g,bl),w=1+hsl[1];
    var o=b[n]||(b[n]={w:0,r:0,g:0,b:0,k:0});o.w+=w;o.r+=r;o.g+=g;o.b+=bl;o.k++}
  var best=null;Object.keys(b).forEach(function(k){if(!best||b[k].w>b[best].w)best=k});
  if(!best)return {hex:'#8a8a8a',name:'회색'};
  var o=b[best];
  var h2=function(v){var s=Math.round(v/o.k).toString(16);return s.length<2?'0'+s:s};
  return {hex:'#'+h2(o.r)+h2(o.g)+h2(o.b),name:best};
}

function setPath(p,v){var k=p.split('.'),o=ui;for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
document.addEventListener('input',function(e){

});

});
function handlePhoto(file){
  var rd=new FileReader();
  rd.onload=function(){var img=new Image();img.onload=function(){
    var c=document.createElement('canvas'),m=360,sc=Math.min(1,m/Math.max(img.width,img.height));c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    var res=analyze(img),ratio=img.width/img.height;
    ui.ff.photo=c.toDataURL('image/jpeg',.7);ui.ff.color=res.hex;ui.ff.cname=res.name;
    ui.ff.rec=(ratio>1.9||ratio<.52)?'우산':'';if(ui.ff.rec)ui.ff.cat=ui.ff.rec;
    ui.err='';render()};img.onerror=function(){toast('이미지를 읽지 못했어요. 다른 사진을 올려 보세요.')};img.src=rd.result};
  rd.readAsDataURL(file);
}

 fcat:function(v){ui.fcat=v},

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='closemodal'){if(e.target!==el)return;a='closemodal2'}

});

try{var rr=sessionStorage.getItem('ss-role');if(rr==='teacher'||rr==='student')ui.role=rr}catch(e){}
function sub(name,coll,onChange){
  var first=true;
  DB.collection(name).onSnapshot(function(snap){
    coll.arr=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    var ch=first?[]:snap.docChanges().filter(function(c){return !c.doc.metadata.hasPendingWrites});
    first=false;if(onChange)onChange(ch);save();render();
  },function(e){coll.arr=null;render()});
}
function setLive(on,txt){var l=$('#live');if(l){l.className='live'+(on?'':' off');l.lastChild.textContent=txt;l.hidden=(txt==='실시간 연결됨'||txt==='로컬 데모'||txt==='연결 중')}}
setLive(false,'로컬 데모');
(async function connect(){
  try{
    var user=await window.claude.use('user'),db=await window.claude.use('db');
    if(!db||!user)return;
    try{MY_ID=await user.id()}catch(e){}
    try{MY_NAME=(await user.name())||''}catch(e){}
    if(!MY_ID)return;
    try{RO=((await user.can('data.write'))===false)}catch(e){}
    DB=db;var first=true;
    DB.collection('bookings').onSnapshot(function(snap){
      var arr=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
      if(!first){snap.docChanges().forEach(function(c){
        var b=c.doc.data();if(!b||c.doc.metadata.hasPendingWrites)return;
        var mine=b.uid===MY_ID,f=fac(b.fac);if(!f)return;
        if(c.type==='added'&&ui.role==='teacher'&&(b.status==='pending'||b.status==='confirmed')){var m=(b.who||'학생')+' 님이 '+f.name+' '+b.date.slice(5).replace('-','/')+' '+pad(b.hour)+':00 '+(b.status==='pending'?'예약을 요청했어요. 승인이 필요해요.':'예약했어요.');note(m);toast(m)}
        if(c.type==='modified'&&mine&&(b.status==='confirmed'||b.status==='rejected'||(b.status==='cancelled'&&b.canceledBy==='teacher'))){var m2=f.name+' '+b.date.slice(5).replace('-','/')+' '+pad(b.hour)+':00 예약이 '+(b.status==='confirmed'?'승인됐어요.':b.status==='rejected'?'반려됐어요.':'교사에 의해 취소됐어요.');note(m2);toast(m2)}
      })}
      first=false;DBK=arr;setLive(!RO,RO?'읽기 전용 계정':'실시간 연결됨');sweep();save();render();
    },function(e){DBK=null;setLive(false,'연결 끊김');render()});
    sub('students',STU,function(){
      var mine=STU.get(MY_ID);
      if(!mine){if(!meDone){meDone=true;syncMe()}return}
      meDone=true;
      if((mine.cls!==g1(S.me.cls)||mine.name!==(MY_NAME||S.me.name))&&!syncT)syncMe();
      if(!syncT&&mine.score!==S.me.score){var old=S.me.score,nv=mine.score;S.me.score=nv;S.log.unshift({t:Date.now(),d:Math.round((nv-old)*10)/10,why:'교사 확인 결과'});S.log=S.log.slice(0,20);var m3='매너온도가 '+old.toFixed(1)+'° → '+nv.toFixed(1)+'°로 조정됐어요.';note(m3);toast(m3)}
    });
    sub('reports',RP,function(ch){ch.forEach(function(c){var r=c.doc.data();
      if(c.type==='added'&&ui.role==='teacher'){var m=r.status==='pending'?'새 신고가 접수됐어요: '+r.targetName+' 님 ('+(r.reasons||[]).join(', ')+'). 확인이 필요해요.':r.targetName+' 님에 대한 '+(RK[r.kind]||'신고')+'가 접수됐어요. ('+r.itemTitle+')';note(m);toast(m)}
      if(c.type==='modified'&&MY_ID&&r.ruid===MY_ID&&(r.status==='applied'||r.status==='dismissed')){var m4='내가 한 신고('+r.targetName+' 님)가 '+(r.status==='applied'?'확인됐어요. 교사가 매너온도를 조정했어요.':'검토 후 기각됐어요.');note(m4);toast(m4)}})});
    sub('claims',CL,function(ch){
      CL.all().forEach(function(c){if(!MY_ID||c.cuid!==MY_ID)return;var f=S.found.filter(function(x){return x.id===c.foundId})[0];if(!f)return;

      ch.forEach(function(c){var x=c.doc.data();
        if(c.type==='added'&&x.status==='pending'&&ui.role==='teacher'){var m='물건의 주인이 나타났어요: '+x.title+' ('+x.claimant+' 님 요청)';note(m);toast(m)}
        if(c.type==='modified'&&MY_ID&&x.cuid===MY_ID&&(x.status==='approved'||x.status==='rejected')){var m2=x.status==='approved'?x.title+' 인계가 확인됐어요. '+FSTORE[x.store]+' 장소에서 받아 가세요.':x.title+' 주인 확인이 거절됐어요. 선생님께 문의해 주세요.';note(m2);toast(m2)}})});
  }catch(e){setLive(false,'로컬 데모')}
})();
sweep();render();
setInterval(function(){if(sweep())render()},60000);
})();
